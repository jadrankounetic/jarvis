<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000308">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #000308;
    --bg: #03070f;
    --bg-panel: rgba(8, 18, 32, 0.6);
    --cyan: #4dd6ff;
    --cyan-bright: #aef0ff;
    --cyan-dim: #1a6b8c;
    --gold: #ffb547;
    --red: #ff4d4d;
    --text: #c8e8ff;
    --text-dim: #5a7a92;
    --border: rgba(77, 214, 255, 0.25);
    --border-strong: rgba(77, 214, 255, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    position: relative;
  }

  /* Scanline + grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(77, 214, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 214, 255, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,3,8,0.7) 80%),
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(77,214,255,0.025) 2px, rgba(77,214,255,0.025) 3px);
    pointer-events: none;
    z-index: 1;
  }

  .app {
    position: relative;
    z-index: 2;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--cyan-bright);
    font-weight: 700;
  }
  .brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .topbar-right {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cyan);
    width: 32px; height: 32px;
    border-radius: 4px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
    font-family: inherit;
    font-size: 14px;
  }
  .icon-btn:hover, .icon-btn:active {
    background: rgba(77, 214, 255, 0.1);
    border-color: var(--cyan);
    color: var(--cyan-bright);
  }

  /* Status line under topbar */
  .status-line {
    display: flex;
    justify-content: space-between;
    padding: 8px 18px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .status-line span { color: var(--cyan); }

  /* Main area */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
    padding: 10px 16px;
  }

  /* Orb / reactor core */
  .reactor-wrap {
    position: relative;
    width: min(280px, 60vw);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    margin: 10px 0;
    flex-shrink: 0;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--border);
    pointer-events: none;
  }
  .ring-1 { inset: 0; border-color: var(--border-strong); }
  .ring-2 { inset: 12%; border-style: dashed; animation: rotate-cw 24s linear infinite; }
  .ring-3 { inset: 24%; border-color: var(--cyan); border-top-color: transparent; border-left-color: transparent; animation: rotate-ccw 8s linear infinite; }

  @keyframes rotate-cw { to { transform: rotate(360deg); } }
  @keyframes rotate-ccw { to { transform: rotate(-360deg); } }

  .core {
    position: absolute;
    inset: 32%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, var(--cyan-bright), var(--cyan) 30%, var(--cyan-dim) 60%, transparent 75%);
    box-shadow:
      0 0 40px var(--cyan),
      0 0 80px rgba(77, 214, 255, 0.5),
      inset 0 0 30px rgba(255, 255, 255, 0.3);
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  /* State variants */
  .reactor-wrap[data-state="listening"] .core {
    animation: pulse-listen 0.6s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--cyan) 30%, var(--cyan-dim) 60%, transparent 75%);
  }
  @keyframes pulse-listen {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .reactor-wrap[data-state="listening"] .ring-2 { animation-duration: 6s; }
  .reactor-wrap[data-state="listening"] .ring-3 { animation-duration: 2s; border-color: var(--cyan-bright); }

  .reactor-wrap[data-state="thinking"] .core {
    background: radial-gradient(circle at 35% 30%, var(--gold), #ff8c00 30%, #663300 60%, transparent 75%);
    box-shadow: 0 0 40px var(--gold), 0 0 80px rgba(255, 181, 71, 0.5);
    animation: spin-think 2s linear infinite;
  }
  @keyframes spin-think {
    0% { transform: rotate(0); }
    100% { transform: rotate(360deg); }
  }

  .reactor-wrap[data-state="speaking"] .core {
    animation: speak-pulse 0.4s ease-in-out infinite;
  }
  @keyframes speak-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .reactor-wrap[data-state="error"] .core {
    background: radial-gradient(circle at 35% 30%, #ffaaaa, var(--red) 30%, #660000 60%, transparent 75%);
    box-shadow: 0 0 40px var(--red), 0 0 80px rgba(255, 77, 77, 0.5);
  }

  /* HUD corners */
  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--cyan);
  }
  .corner-tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .corner-tr { top: -4px; right: -4px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: -4px; left: -4px; border-right: none; border-top: none; }
  .corner-br { bottom: -4px; right: -4px; border-left: none; border-top: none; }

  /* State label */
  .state-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--cyan);
    text-transform: uppercase;
    margin: 14px 0 6px;
    min-height: 18px;
    text-shadow: 0 0 10px var(--cyan);
  }

  /* Transcript area */
  .transcript {
    width: 100%;
    max-width: 600px;
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px 12px;
    margin-top: 6px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  }
  .transcript::-webkit-scrollbar { width: 4px; }
  .transcript::-webkit-scrollbar-track { background: transparent; }
  .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.5;
    animation: fade-in 0.3s ease-out;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--cyan);
    margin-bottom: 4px;
  }
  .msg-user .msg-label { color: var(--gold); }
  .msg-error .msg-label { color: var(--red); }
  .msg-error .msg-text { color: #ff9999; }
  .msg-text {
    color: var(--text);
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .msg-user .msg-text { border-left-color: rgba(255, 181, 71, 0.4); }
  .msg-interim .msg-text { color: var(--text-dim); font-style: italic; }

  /* Mic button */
  .mic-area {
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .mic-btn {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    background: radial-gradient(circle, rgba(77,214,255,0.2), rgba(77,214,255,0.05));
    color: var(--cyan-bright);
    font-size: 32px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(77, 214, 255, 0.3);
  }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn[data-active="true"] {
    background: radial-gradient(circle, var(--cyan), var(--cyan-dim));
    color: #000;
    box-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(77, 214, 255, 0.5);
    animation: mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(77, 214, 255, 0.5); }
    50% { box-shadow: 0 0 50px var(--cyan), 0 0 90px rgba(77, 214, 255, 0.8); }
  }
  .mic-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    animation: none;
  }
  .mic-hint {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Settings modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 3, 8, 0.85);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop[data-open="true"] { display: flex; }
  .modal {
    background: var(--bg);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 40px rgba(77, 214, 255, 0.3);
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
  }
  .modal::before, .modal::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid var(--cyan);
  }
  .modal::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .modal::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .modal h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--cyan-bright);
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    background: rgba(77, 214, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: var(--cyan); }
  .field-hint {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.5;
  }
  .field-hint a { color: var(--cyan); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover, .btn:active {
    background: var(--cyan);
    color: #000;
  }
  .btn-secondary { border-color: var(--border); color: var(--text-dim); }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #000; }

  .warning {
    padding: 10px 12px;
    border: 1px solid rgba(255, 181, 71, 0.4);
    background: rgba(255, 181, 71, 0.05);
    color: var(--gold);
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  /* Empty transcript hint */
  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>J.A.R.V.I.S.</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="clearBtn" title="Clear conversation">⟲</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </div>

  <div class="status-line">
    <div>SYS <span id="sysStatus">ONLINE</span></div>
    <div>LANG <span id="langStatus">--</span></div>
    <div>MODEL <span id="modelStatus">--</span></div>
  </div>

  <div class="main">
    <div class="reactor-wrap" id="reactor" data-state="idle">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="core"></div>
    </div>
    <div class="state-label" id="stateLabel">STANDBY</div>
    <div class="transcript" id="transcript">
      <div class="empty-hint" id="emptyHint">Tap microphone to begin</div>
    </div>
  </div>

  <div class="mic-area">
    <button class="mic-btn" id="micBtn" data-active="false">🎤</button>
    <div class="mic-hint" id="micHint">Tap to speak</div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>System Configuration</h2>

    <div class="warning">
      ⚠ Your API key is stored only on this device. For personal use only — for a production app, route requests through a backend.
    </div>

    <div class="field">
      <label>Anthropic API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
      <div class="field-hint">Get one at <a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a></div>
    </div>

    <div class="field">
      <label>Language</label>
      <select id="langSelect">
        <option value="auto">Auto-detect</option>
        <option value="hr-HR">Hrvatski</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="de-DE">Deutsch</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="it-IT">Italiano</option>
      </select>
    </div>

    <div class="field">
      <label>Model</label>
      <select id="modelSelect">
        <option value="claude-opus-4-7">Opus 4.7 — most capable</option>
        <option value="claude-sonnet-4-6" selected>Sonnet 4.6 — balanced</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 — fastest, cheapest</option>
      </select>
    </div>

    <div class="field">
      <label>Voice Pitch</label>
      <input type="range" id="pitchSlider" min="0.5" max="1.5" step="0.05" value="0.85">
      <div class="field-hint">Lower = deeper voice</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="saveSettings">Save</button>
      <button class="btn btn-secondary" id="closeSettings">Close</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="resetAll">Reset All Data</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ------------ Config & state ------------
  const API_URL = 'https://api.anthropic.com/v1/messages';
  const ANTHROPIC_VERSION = '2023-06-01';

  const SYSTEM_PROMPT = `You are J.A.R.V.I.S. — Just A Rather Very Intelligent System — a personal AI assistant inspired by the one from Iron Man.

Personality:
- Sophisticated, articulate, with subtle dry wit.
- Loyal, efficient, never sycophantic. Slightly British in tone if speaking English.
- Address the user respectfully — "sir" in English, "gospodine" in Croatian, "señor" in Spanish, etc. Use sparingly, not in every reply.

Response style — VERY IMPORTANT, your replies are spoken aloud:
- Be concise. One to three sentences for most answers. Longer only when the user explicitly asks for detail.
- Plain prose only. No markdown, no asterisks, no bullet points, no headers, no code fences.
- Avoid emoji.
- Spell out abbreviations when ambiguous in speech.
- If you genuinely don't know, say so briefly.

Language:
- Detect the user's language from their message and reply in the same language.
- For Croatian/Bosnian/Serbian, write naturally as a native speaker would.

You are speaking through a phone. Keep it natural, like a trusted advisor on call.`;

  const state = {
    apiKey: localStorage.getItem('jarvis_api_key') || '',
    lang: localStorage.getItem('jarvis_lang') || 'auto',
    model: localStorage.getItem('jarvis_model') || 'claude-sonnet-4-6',
    pitch: parseFloat(localStorage.getItem('jarvis_pitch') || '0.85'),
    history: JSON.parse(localStorage.getItem('jarvis_history') || '[]'),
    recognition: null,
    recognizing: false,
    processing: false,
    speaking: false,
    currentLang: 'en-US',
  };

  // ------------ DOM refs ------------
  const $ = (id) => document.getElementById(id);
  const reactor = $('reactor');
  const stateLabel = $('stateLabel');
  const transcript = $('transcript');
  const emptyHint = $('emptyHint');
  const micBtn = $('micBtn');
  const micHint = $('micHint');
  const sysStatus = $('sysStatus');
  const langStatus = $('langStatus');
  const modelStatus = $('modelStatus');

  // ------------ UI helpers ------------
  function setState(s) {
    reactor.dataset.state = s;
    const labels = {
      idle: 'STANDBY',
      listening: 'LISTENING',
      thinking: 'PROCESSING',
      speaking: 'RESPONDING',
      error: 'ERROR',
    };
    stateLabel.textContent = labels[s] || s.toUpperCase();
  }

  function updateMic() {
    const active = state.recognizing;
    micBtn.dataset.active = active ? 'true' : 'false';
    micBtn.disabled = state.processing || state.speaking;
    if (state.processing) micHint.textContent = 'Thinking...';
    else if (state.speaking) micHint.textContent = 'Speaking...';
    else if (state.recognizing) micHint.textContent = 'Listening — tap to stop';
    else micHint.textContent = 'Tap to speak';
  }

  function addMessage(role, text, opts = {}) {
    if (emptyHint) emptyHint.remove();
    const div = document.createElement('div');
    div.className = `msg msg-${role}` + (opts.interim ? ' msg-interim' : '');
    if (opts.id) div.id = opts.id;
    div.innerHTML = `
      <div class="msg-label">${role === 'user' ? '> YOU' : role === 'error' ? '! ERROR' : 'J.A.R.V.I.S.'}</div>
      <div class="msg-text"></div>`;
    div.querySelector('.msg-text').textContent = text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
    return div;
  }

  function updateMessage(el, text) {
    if (el) el.querySelector('.msg-text').textContent = text;
    transcript.scrollTop = transcript.scrollHeight;
  }

  // ------------ Speech recognition ------------
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      sysStatus.textContent = 'NO STT';
      sysStatus.style.color = 'var(--red)';
      return null;
    }
    const r = new SR();
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;
    return r;
  }

  function startListening() {
    if (state.recognizing || state.processing || state.speaking) return;
    if (!state.apiKey) { openSettings(); return; }

    if (!state.recognition) state.recognition = initRecognition();
    if (!state.recognition) {
      addMessage('error', 'Speech recognition not available in this browser. Use Chrome on Android.');
      return;
    }

    const r = state.recognition;
    const lang = state.lang === 'auto' ? state.currentLang : state.lang;
    r.lang = lang;
    langStatus.textContent = lang.split('-')[0].toUpperCase();

    let interimEl = null;
    let finalText = '';

    r.onstart = () => {
      state.recognizing = true;
      setState('listening');
      updateMic();
    };
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      if (interim) {
        if (!interimEl) interimEl = addMessage('user', interim, { interim: true });
        else updateMessage(interimEl, interim);
      }
    };
    r.onerror = (e) => {
      state.recognizing = false;
      if (e.error === 'no-speech' || e.error === 'aborted') {
        setState('idle');
      } else {
        addMessage('error', `Mic error: ${e.error}`);
        setState('error');
        setTimeout(() => setState('idle'), 1500);
      }
      updateMic();
    };
    r.onend = () => {
      state.recognizing = false;
      if (interimEl) interimEl.remove();
      if (finalText.trim()) {
        handleUserMessage(finalText.trim(), lang);
      } else {
        setState('idle');
      }
      updateMic();
    };

    try { r.start(); }
    catch (err) { console.error(err); }
  }

  function stopListening() {
    if (state.recognition && state.recognizing) {
      try { state.recognition.stop(); } catch {}
    }
  }

  // ------------ Claude API ------------
  async function callClaude(userText) {
    state.history.push({ role: 'user', content: userText });

    const body = {
      model: state.model,
      max_tokens: 1024,
      system: SYSTEM_PROMPT,
      messages: state.history.slice(-20), // last 10 turns
    };

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': ANTHROPIC_VERSION,
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const errText = await res.text();
      let msg = `HTTP ${res.status}`;
      try { msg = JSON.parse(errText).error?.message || msg; } catch {}
      throw new Error(msg);
    }

    const data = await res.json();
    const text = data.content?.map(c => c.text || '').join('').trim() || '';
    state.history.push({ role: 'assistant', content: text });
    localStorage.setItem('jarvis_history', JSON.stringify(state.history.slice(-40)));
    return text;
  }

  // ------------ Text-to-speech ------------
  function speak(text, lang) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) { resolve(); return; }

      // Cancel any existing speech
      window.speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 1.0;
      u.pitch = state.pitch;
      u.volume = 1.0;

      // Pick the best available voice for this language
      const voices = window.speechSynthesis.getVoices();
      const langPrefix = lang.split('-')[0];
      const candidates = voices.filter(v => v.lang.startsWith(langPrefix));
      // Prefer male / Google / non-novelty voices
      const pick =
        candidates.find(v => /male/i.test(v.name) && !/female/i.test(v.name)) ||
        candidates.find(v => /Google/i.test(v.name)) ||
        candidates[0];
      if (pick) u.voice = pick;

      u.onstart = () => { state.speaking = true; setState('speaking'); updateMic(); };
      u.onend = () => { state.speaking = false; setState('idle'); updateMic(); resolve(); };
      u.onerror = () => { state.speaking = false; setState('idle'); updateMic(); resolve(); };

      window.speechSynthesis.speak(u);
    });
  }

  // ------------ Main flow ------------
  async function handleUserMessage(text, lang) {
    addMessage('user', text);
    state.processing = true;
    setState('thinking');
    updateMic();

    try {
      const reply = await callClaude(text);
      state.processing = false;
      addMessage('assistant', reply);
      await speak(reply, lang);
    } catch (err) {
      state.processing = false;
      addMessage('error', err.message);
      setState('error');
      setTimeout(() => setState('idle'), 2000);
      updateMic();
    }
  }

  // ------------ Settings ------------
  function openSettings() {
    $('apiKeyInput').value = state.apiKey;
    $('langSelect').value = state.lang;
    $('modelSelect').value = state.model;
    $('pitchSlider').value = state.pitch;
    $('settingsModal').dataset.open = 'true';
  }
  function closeSettings() { $('settingsModal').dataset.open = 'false'; }

  function saveSettings() {
    state.apiKey = $('apiKeyInput').value.trim();
    state.lang = $('langSelect').value;
    state.model = $('modelSelect').value;
    state.pitch = parseFloat($('pitchSlider').value);

    localStorage.setItem('jarvis_api_key', state.apiKey);
    localStorage.setItem('jarvis_lang', state.lang);
    localStorage.setItem('jarvis_model', state.model);
    localStorage.setItem('jarvis_pitch', String(state.pitch));

    refreshStatusBar();
    closeSettings();
  }

  function resetAll() {
    if (!confirm('Erase API key, conversation, and all settings?')) return;
    localStorage.removeItem('jarvis_api_key');
    localStorage.removeItem('jarvis_lang');
    localStorage.removeItem('jarvis_model');
    localStorage.removeItem('jarvis_pitch');
    localStorage.removeItem('jarvis_history');
    location.reload();
  }

  function clearHistory() {
    if (!state.history.length) return;
    if (!confirm('Clear current conversation?')) return;
    state.history = [];
    localStorage.removeItem('jarvis_history');
    transcript.innerHTML = '<div class="empty-hint" id="emptyHint">Tap microphone to begin</div>';
  }

  function refreshStatusBar() {
    langStatus.textContent = state.lang === 'auto' ? 'AUTO' : state.lang.split('-')[0].toUpperCase();
    const m = state.model;
    modelStatus.textContent = m.includes('opus') ? 'OPUS' : m.includes('sonnet') ? 'SONNET' : m.includes('haiku') ? 'HAIKU' : 'CUSTOM';
    sysStatus.textContent = state.apiKey ? 'ONLINE' : 'NO KEY';
    sysStatus.style.color = state.apiKey ? '' : 'var(--gold)';
  }

  function rehydrateHistory() {
    if (!state.history.length) return;
    if (emptyHint) emptyHint.remove();
    state.history.forEach(m => {
      addMessage(m.role === 'user' ? 'user' : 'assistant', m.content);
    });
  }

  // ------------ Wire up ------------
  micBtn.addEventListener('click', () => {
    if (state.recognizing) stopListening();
    else startListening();
  });
  $('settingsBtn').addEventListener('click', openSettings);
  $('clearBtn').addEventListener('click', clearHistory);
  $('saveSettings').addEventListener('click', saveSettings);
  $('closeSettings').addEventListener('click', closeSettings);
  $('resetAll').addEventListener('click', resetAll);

  // Trigger voice list load (some browsers are lazy)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // Initial setup
  refreshStatusBar();
  rehydrateHistory();
  setState('idle');

  // Prompt for API key on first launch
  if (!state.apiKey) {
    setTimeout(() => openSettings(), 400);
  }

  // Detect browser language for auto mode
  if (state.lang === 'auto' && navigator.language) {
    state.currentLang = navigator.language;
  }
})();
</script>
</body>
</html>
